# CreateMind — Nginx site config
#
# Install:
#   sudo cp deploy/nginx/createmind.org.conf /etc/nginx/sites-available/createmind.org
#   sudo ln -s /etc/nginx/sites-available/createmind.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt):
#   sudo certbot --nginx -d createmind.org -d www.createmind.org
#
# Build & deploy static site:
#   cd landing && pnpm install && PUBLIC_API_URL=https://createmind.org/api pnpm build
#   sudo rsync -av --delete dist/ /var/www/createmind/landing/dist/
#
# Backend (systemd/pm2 on port 5000):
#   cd server && pnpm install && pnpm start
#   Set CORS_ORIGIN_PROD=https://createmind.org,https://www.createmind.org

upstream createmind_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name createmind.org www.createmind.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://createmind.org$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.createmind.org;

    ssl_certificate     /etc/letsencrypt/live/createmind.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/createmind.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://createmind.org$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name createmind.org;

    ssl_certificate     /etc/letsencrypt/live/createmind.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/createmind.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/createmind/landing/dist;
    index index.html;

    # Voice transcription uploads (multer limit: 25 MB)
    client_max_body_size 26m;

    access_log /var/log/nginx/createmind.access.log;
    error_log  /var/log/nginx/createmind.error.log;

    # Static assets — long cache (Astro hashes filenames in /_astro/)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(ico|svg|webp|avif|jpg|jpeg|png|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API → Express backend
    location /api/ {
        proxy_pass http://createmind_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # AI chat / spec generation can take a while
        proxy_buffering off;
    }

    # Astro static site
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
